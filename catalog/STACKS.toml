# 三套已决策的插件方案
#
# 这是「七步决策」的落地结果：每个互斥格只留一个赢家，停更项与联网项全部剔除。
# 逐格的取舍理由见 ../docs/DECIDED.md，决策顺序本身见 ../docs/CHOOSING.md。
#
# 用法：
#   python tools/parse_selection.py --stack minimal     --apply
#   python tools/parse_selection.py --stack recommended --apply
#   python tools/parse_selection.py --stack full        --apply
#
# --apply 会把勾选状态**完全重写**成该方案的清单（不在清单里的一律取消勾选），
# 所以切换方案就是一条命令，不用手工收拾。
#
# 关键一点：nvim-mini/mini.nvim 的 45+ 个模块共用一个仓库，
# 所以列再多 mini 模块都只算 **1 个仓库**、只占一份 vendor 体积。

[minimal]
desc = "极简：mini 模块为骨干，除 rg/fzf 外不依赖任何外部工具。启动最快、行为最可预测。"
plugins = [
  # --- mini.nvim 模块（同一个仓库）---
  "nvim-mini/mini.nvim#mini.icons",
  "nvim-mini/mini.nvim#mini.statusline",
  "nvim-mini/mini.nvim#mini.tabline",
  "nvim-mini/mini.nvim#mini.starter",
  "nvim-mini/mini.nvim#mini.clue",
  "nvim-mini/mini.nvim#mini.notify",
  "nvim-mini/mini.nvim#mini.sessions",
  "nvim-mini/mini.nvim#mini.visits",
  "nvim-mini/mini.nvim#mini.ai",
  "nvim-mini/mini.nvim#mini.surround",
  "nvim-mini/mini.nvim#mini.pairs",
  "nvim-mini/mini.nvim#mini.comment",
  "nvim-mini/mini.nvim#mini.bracketed",
  "nvim-mini/mini.nvim#mini.move",
  "nvim-mini/mini.nvim#mini.operators",
  "nvim-mini/mini.nvim#mini.indentscope",
  "nvim-mini/mini.nvim#mini.hipatterns",
  "nvim-mini/mini.nvim#mini.trailspace",
  "nvim-mini/mini.nvim#mini.bufremove",
  "nvim-mini/mini.nvim#mini.cursorword",
  "nvim-mini/mini.nvim#mini.align",
  "nvim-mini/mini.nvim#mini.splitjoin",
  # --- 主题：留几个候选，随时切换（都是纯 Lua，不加运行成本）---
  "folke/tokyonight.nvim",        # 默认
  "catppuccin/nvim",
  "rebelot/kanagawa.nvim",
  "sainnhe/gruvbox-material",
  "EdenEast/nightfox.nvim",
  "rose-pine/neovim",
  # --- 搜索（需求 4/5）---
  "ibhagwan/fzf-lua",
  "folke/flash.nvim",
  # --- 语法 ---
  "nvim-treesitter/nvim-treesitter",
  "nvim-treesitter/nvim-treesitter-textobjects",
  # --- LSP ---
  "neovim/nvim-lspconfig",
  "folke/lazydev.nvim",
  "j-hui/fidget.nvim",
  # --- 补全与片段 ---
  "saghen/blink.cmp",
  "L3MON4D3/LuaSnip",
  "rafamadriz/friendly-snippets",
  # --- 格式化与检查 ---
  "stevearc/conform.nvim",
  "mfussenegger/nvim-lint",
  # --- Git 与诊断 ---
  "lewis6991/gitsigns.nvim",
  "folke/trouble.nvim",
  # --- 文件操作 ---
  "stevearc/oil.nvim",
  # --- 中文输入 ---
  "keaising/im-select.nvim",
  # --- 公共依赖 ---
  "nvim-lua/plenary.nvim",
]

