# Neovide 的 GUI 配置，随发行版一起分发。
#
# 为什么放在包里而不是用户的 %APPDATA%\neovide\config.toml：
#   1. 配置跟着包走，换机器 / 换目录不用重配
#   2. 不污染用户全局设置
# 启动器会把它设成 NEOVIDE_CONFIG 指过去。
#
# 注意：这里只放 GUI 外观。编辑器行为（键位、插件、LSP）一律在 lua/ 里，
# 否则同一套设置的真相会被劈成两半，排查时非常难受。

# ---------------------------------------------------------------------------
# 初始窗口尺寸（**顶层键，必须写在任何 [表] 之前**）
#
# 不设的话 Neovide 按 nvim 的 columns/lines（默认 80x24）开窗，看起来又小又扁。
# 三种写法互斥，只能选一个：
#
#   maximized = true         # 直接最大化，适配任何屏幕与缩放比例（当前默认）
#   size      = "2100x1350"  # 窗口尺寸，单位是**物理像素**
#   grid      = "160x45"     # 按字格数，随字号变化
#
# 为什么默认用 maximized 而不是 size：**size 是物理像素**。
# 在 150% 缩放的 2560x1600 屏上，写 size = "1400x900" 实际只得到
# 933x600 逻辑大小 —— 看起来仍然很小，而写 2100x1350 在 100% 缩放的
# 1920x1080 屏上又会超出屏幕。同一个数字不可能兼顾，所以交给最大化。
#
# 想要固定大小就自己改 size，并按「期望逻辑尺寸 × 缩放比例」换算。
# 嫌最大化太满，可用 grid（按字格算，随字号走，不受缩放差影响）。
#
# 踩坑记录：把 size 写在 [font] 表之后，就变成了 font.size，与字号同名冲突，
# TOML 报 duplicate key，**整份配置作废退回默认**——表现为「改了完全没生效」。
# ---------------------------------------------------------------------------
maximized = true

[font]
size = 13.0

# ---------------------------------------------------------------------------
# 字体：顺序即优先级，Neovide 取第一个能加载的作为主字体，
# 后面的用于补前面缺的字形（CJK、图标）。
#
# 两个踩过的坑，都会导致「字与字之间有空隙」：
#
# 1) 列了本机不存在的字体。Neovide 只打一行 WARN
#    「Some configured fonts could not be loaded and will be skipped」，
#    然后静默退回内置字体 —— 表面看不出，实际字距全乱。
#    查证方法：neovide --log，然后看日志里那行 WARN 列了哪些族名。
#
# 2) 中文回退用了**比例字体**（微软雅黑、Noto Sans SC 都是）。
#    等宽网格里塞比例字形，宽度对不上，视觉上就是字之间多出空隙。
#    所以中文优先放真正等宽的「新宋体」（NSimSun，其 CJK 宽度是 ASCII 的两倍）。
#
# 加到这里的每个族名，务必先用 `--log` 确认能加载，否则只会加噪音。
# ---------------------------------------------------------------------------

# 主字体：等宽 + Nerd Font 图标（本发行版图标强依赖 Nerd Font）
[[font.normal]]
family = "FiraCode Nerd Font Mono"

[[font.normal]]
family = "JetBrainsMono NFM"

[[font.normal]]
family = "JetBrainsMono Nerd Font"

# 没有 Nerd Font 时的等宽兜底（Windows 11 / Windows 自带）
[[font.normal]]
family = "Cascadia Mono"

[[font.normal]]
family = "Consolas"

# 中文回退：先等宽的，再退到比例字体
[[font.normal]]
family = "Sarasa Mono SC"

[[font.normal]]
family = "新宋体"

[[font.normal]]
family = "Microsoft YaHei UI"

[box-drawing]
# 用字体自带字形画框线。Nerd Font / Sarasa 都自带，视觉上与终端一致；
# 若发现框线错位可改成 "native"。
mode = "font-glyph"
