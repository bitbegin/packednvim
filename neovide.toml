# Neovide 的 GUI 配置，随发行版一起分发。
#
# 为什么放在包里而不是用户的 %APPDATA%\neovide\config.toml：
#   1. 配置跟着包走，换机器 / 换目录不用重配
#   2. 不污染用户全局设置
# 启动器 neovide.cmd / neovide.sh 会把它设成 NEOVIDE_CONFIG 指过去。
#
# 注意：这里只放 GUI 外观。编辑器行为（键位、插件、LSP）一律在 lua/ 里，
# 否则同一套设置的真相会被劈成两半，排查时非常难受。

[font]
# 字号。
size = 13.0

# 字体族用**数组表**形式逐个列出，第一个是主字体，后面的是回退。
#
# 踩过的坑：不能同时写 `normal = ["..."]` 和 `[[font.normal]]` —— TOML 会报
# `duplicate key`，Neovide 直接整份配置作废、退回默认（中文就成方块）。
# 二者只能选一种写法；需要回退字体就必须全部用 `[[font.normal]]`。
[[font.normal]]
family = "JetBrainsMono NFM"

# 中文回退。按你机器上实际装了的排优先级即可，Neovide 会用第一个存在的。
# 不配这一段，中文会显示成方块 —— Neovide 内置字体不含 CJK 字形。
[[font.normal]]
family = "JetBrainsMono Nerd Font"

[[font.normal]]
family = "Sarasa Mono SC"

[[font.normal]]
family = "Microsoft YaHei"

[box-drawing]
# 用字体自带字形画框线。Nerd Font / Sarasa 都自带，视觉上与终端一致；
# 若发现框线错位可改成 "native"。
mode = "font-glyph"
