# 自动打包：按平台各出一个包，发到 Release。
#
# 与上一版的根本区别：**每个平台在自己的作业里产出一个完整、自足的包**。
#   nvim 本体、随包工具、tree-sitter 解析器、blink 原生库、jieba cdylib
#   全部在同一个作业里产出并直接进包。
# 上一版是「两个平台采集 → 汇总成一个包」，中间要把 pack/ 的改动从采集作业
# 传给打包作业；那条链路丢过东西（blink 原生库与 jieba cdylib 被整个丢掉，
# 包里根本没有）。现在没有跨作业传递，也就不存在这类丢失。
#
# 另一个关键点：解析器由**包内那个 nvim** 编译。解析器与 Neovim 内嵌的
# tree-sitter 运行时强耦合，让同一个二进制既编译又加载，ABI 失配就不可能发生。
name: build-and-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的 tag（留空则按下面的规则自动生成）'
        required: false
        default: ''
      nvim_tag:
        description: 'Neovim 版本：nightly，或 v0.12.6 这类稳定 tag'
        required: false
        default: 'nightly'
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NVIM_TAG: ${{ github.event.inputs.nvim_tag || 'nightly' }}

jobs:
  # ==========================================================================
  # 1. 拉插件。与平台无关，只做一次。
  # ==========================================================================
  vendor:
    name: 拉取插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 由目录勾选重新生成 selection.json
        run: python3 tools/parse_selection.py

      - name: 校验方案里没有同格多选
        run: python3 tools/check-stack.py

      - name: 按 vendor/lock.json 拉取插件（锁定 commit）
        shell: pwsh
        run: ./tools/vendor.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: pack
          path: pack/distro
          retention-days: 3

  # ==========================================================================
  # 2. 逐平台构建完整包。
  #
  # 关于 runner：arm64 与 Intel macOS 的托管 runner 是较新的，
  # 若账号里不可用，对应作业会以「找不到 runner」失败 —— 那时删掉矩阵里那一项即可。
  # ==========================================================================
  build:
    name: 构建（${{ matrix.id }}）
    needs: vendor
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux64
            runner: ubuntu-latest
            tools: linux-x64
            triple: x86_64-unknown-linux-gnu
            ts_cli: tree-sitter-cli-linux-x64.zip
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            tools: linux-arm64
            triple: aarch64-unknown-linux-gnu
            ts_cli: tree-sitter-cli-linux-arm64.zip
          - id: win64
            runner: windows-latest
            tools: windows-x64
            triple: x86_64-pc-windows-msvc
            ts_cli: tree-sitter-cli-windows-x64.zip
          # 注：不出 macOS Intel（darwin-x64）的包 —— 对应托管 runner 不可用。
          # tools/fetch-runtime.ps1 与 fetch-tools.ps1 仍然支持该平台，
          # 在 Intel Mac 或自建 runner 上可以照常打出这个包。
          - id: darwin-arm64
            runner: macos-14
            tools: darwin-arm64
            triple: aarch64-apple-darwin
            ts_cli: tree-sitter-cli-macos-arm64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pack
          path: pack/distro

      # ---- 运行时：把 Neovim 取下来放进 runtime/ -------------------------
      # 传 GITHUB_TOKEN：未认证的 API 每 IP 每小时只有 60 次，而本工作流有 5 个平台
      # 各自要查 Neovim + 6 个工具仓库，很容易撞限流（限流时响应没有 assets 字段，
      # 会伪装成「上游没有这个产物」）。
      - name: 取 Neovim 本体
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/fetch-runtime.ps1 -Platform ${{ matrix.id }} -Tag $env:NVIM_TAG

      # ---- 随包工具：只取本平台那一份 ------------------------------------
      - name: 取随包工具
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/fetch-tools.ps1 -Platform ${{ matrix.tools }}

      - name: 让 PATH 指向包内的 nvim
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'runtime/bin'
          if (-not (Test-Path $bin)) { throw "找不到 runtime/bin —— 取 Neovim 那步没成功？" }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path $bin $(if ($IsWindows) { 'nvim.exe' } else { 'nvim' })) --version | Select-Object -First 3

      # ---- tree-sitter CLI（编译解析器要用） ----------------------------
      # **必须按架构取**。在 arm64 runner 上取 x64 的 CLI，内核会拒绝执行该文件，
      # 而 sh 会兜底把它当脚本跑 —— 表现为刷屏的
      #   tree-sitter: 1: cannot create ^A<90><83>P@...
      #   tree-sitter: 14: Syntax error: "(" unexpected
      # 完全看不出是架构不匹配。所以产物名在矩阵里显式写死，并在下面立刻验证。
      - name: 安装 tree-sitter CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = 'v0.27.1'
          $asset = '${{ matrix.ts_cli }}'
          $dir = Join-Path $env:RUNNER_TEMP 'ts'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ts.zip'
          Invoke-WebRequest -Uri "https://github.com/tree-sitter/tree-sitter/releases/download/$ver/$asset" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          # 必须加平台判断：Windows 上没有 chmod，而 $ErrorActionPreference='Stop'
          # 会把「命令不存在」升级成终止错误，直接让 Windows 构建失败。
          if (-not $IsWindows) { & chmod +x (Join-Path $dir 'tree-sitter') }
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

          # 立刻验一次能不能执行：架构错了要在这里明确报错，
          # 而不是留到后面变成几百行看不懂的 shell 报错
          $exe = Join-Path $dir $(if ($IsWindows) { 'tree-sitter.exe' } else { 'tree-sitter' })
          $out = (& $exe --version 2>&1) -join ' '
          if ($LASTEXITCODE -ne 0) {
            throw "tree-sitter CLI 无法执行（架构与本机不匹配？）：$out"
          }
          Write-Host ("tree-sitter {0}  OK   ({1})" -f $out, $asset)

      # Windows 上编译解析器需要 MSVC 的 C 编译器在 PATH 上。
      # 这是第三方 action（供应链上要注意）—— 要更严格就把它钉到某个 commit SHA。
      - name: 准备 MSVC 环境（仅 Windows）
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- 平台相关的插件产物 -------------------------------------------
      - name: 预置 blink.cmp 原生库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = ((Get-Content vendor/lock.json -Raw | ConvertFrom-Json).plugins |
                  Where-Object { $_.repo -eq 'saghen/blink.cmp' }).branch
          if ($tag -notmatch '^v?\d') {
            throw "blink.cmp 在 lock 里的 branch 是 '$tag'，不是版本 tag。修：pwsh tools/vendor.ps1 -Only blink.cmp"
          }
          $ext = if ($IsWindows) { '.dll' } elseif ($IsMacOS) { '.dylib' } else { '.so' }
          $name = "${{ matrix.triple }}$ext"
          $base = "https://github.com/saghen/blink.cmp/releases/download/$tag/"

          $dir = 'pack/distro/start/blink.cmp/target/release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'blinklib'
          $sum = Join-Path $env:RUNNER_TEMP 'blinklib.sha256'
          Invoke-WebRequest -Uri "$base$name"        -OutFile $tmp
          Invoke-WebRequest -Uri "$base$name.sha256" -OutFile $sum
          $want = ((Get-Content $sum -Raw) -split '\s+')[0].ToLower()
          $got  = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "blink 原生库 sha256 不符：期望 $want 实际 $got" }

          $dest = Join-Path $dir "libblink_cmp_fuzzy$ext"
          Copy-Item $tmp $dest -Force
          Write-Host ("已就位 {0}  {1:N0} 字节" -f $dest, (Get-Item $dest).Length)

      - name: 构建 jieba.vim 的 Rust 后端
        shell: pwsh
        env:
          # 这个开关决定编哪个绑定：设为 1 才编 Neovim 的 lua51 绑定并落到
          # lua/jieba_vim/；不设则默认编 Vim 的 py3 绑定、落到 pythonx/。
          JIEBA_VIM_INSTALL_NVIM: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location pack/distro/start/jieba.vim
          try {
            if ($IsWindows) { & pwsh -NoProfile -File ./build.ps1 }
            else { & bash ./build.sh }
            if ($LASTEXITCODE -ne 0) { throw "jieba 构建脚本退出码 $LASTEXITCODE" }
          } finally { Pop-Location }
          $ext = if ($IsWindows) { 'dll' } else { 'so' }
          $lib = "pack/distro/start/jieba.vim/lua/jieba_vim/jieba_vim_rs.$ext"
          if (-not (Test-Path $lib)) { throw "构建后仍找不到 $lib" }
          Get-Item $lib | Select-Object FullName, Length

      # ---- 用包内这个 nvim 编译解析器 ------------------------------------
      - name: 编译 tree-sitter 解析器并校验产物
        shell: pwsh
        env:
          DISTRO_ROOT: ${{ github.workspace }}
        run: nvim --headless -u init.lua -l tools/harvest.lua

      # ---- 组装与归档 ----------------------------------------------------
      - name: 组装并打包
        shell: pwsh
        run: ./tools/package.ps1 -Platform ${{ matrix.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.id }}
          path: |
            dist/packednvim-*.zip
            dist/packednvim-*.tar.gz
            dist/packednvim-*.sha256
          retention-days: 7

  # ==========================================================================
  # 3. 发布
  # ==========================================================================
  release:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          echo "---"
          # 每个平台都必须有归档与校验和，缺一个就说明那个平台没打出来
          for p in linux64 linux-arm64 win64 darwin-arm64; do
            if ls dist/packednvim-$p.* >/dev/null 2>&1; then
              echo "✓ $p"
            else
              echo "::error::缺少 $p 的归档"
              exit 1
            fi
          done

      - name: 生成发布说明
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "本发行版的插件、工具与 Neovim 本体都已随包分发，**运行时不联网**。"
            echo
            echo "按平台下载对应包："
            echo
            echo "| 平台 | 文件 |"
            echo "| --- | --- |"
            for f in dist/*.zip dist/*.tar.gz; do
              [ -e "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "安装与原理见包内 \`docs/INSTALL.md\`；Windows 运行 \`nvim.cmd\`，其它平台运行 \`nvim.sh\`。"
            echo
            echo "### 校验和"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > RELEASE-NOTES.md
          cat RELEASE-NOTES.md

      - name: 发 Release
        # tag 规则：推 main 用 main+<UTC时间戳>+<短hash>（每次构建天然唯一，
        # 因此不存在「覆盖已有 Release」这个动作，也就绕开了 immutable release
        # 不允许替换资源的限制）；推 v* tag 用它本身；手动触发时用输入的 tag。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EXTRA=""
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            :
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # 时间戳格式 %Y%m%dT%H%M%SZ：字典序即时间序，末尾 Z 明确是 UTC。
            # 注意不能用冒号 —— git refname 禁止 ':'。
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            TAG="main+${STAMP}+$(git rev-parse --short=7 HEAD)"
            # 主分支构建是快照而不是版本发布：标成 prerelease，
            # 让 Releases 页的 Latest 徽章留给真正的 v* 版本。
            EXTRA="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，不覆盖。"
            echo "  若仓库启用了 immutable releases，已发布的资源无法删除。"
            exit 1
          fi

          gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/*.sha256 \
            --title "$TAG" --notes-file RELEASE-NOTES.md \
            --target "$GITHUB_SHA" $EXTRA
